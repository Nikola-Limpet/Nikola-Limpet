<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Yuujin - Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.52" stop-color="#0b1530"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="32%" r="52%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".26"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#27365f"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <circle cx="1015" cy="72" r="88" fill="#4f46e5" opacity=".12" filter="url(#soft)"/>
  <circle cx="1090" cy="255" r="110" fill="#0ea5e9" opacity=".08" filter="url(#soft)"/>

  <g opacity=".8" fill="#94a3b8">
    <circle cx="850" cy="54" r="2"/>
    <circle cx="915" cy="88" r="1.5"/>
    <circle cx="1000" cy="40" r="1.5"/>
    <circle cx="1120" cy="72" r="2"/>
    <circle cx="1080" cy="120" r="1"/>
    <circle cx="955" cy="140" r="1"/>
  </g>

  <g transform="translate(70 58)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="0" y="0" fill="#94a3b8" font-size="22">&gt;_ hi there, i'm</text>
    <text x="0" y="76" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="800">Yuujin</text>
    <text x="212" y="76" fill="url(#accent)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="66" font-weight="800">.</text>
    <text x="0" y="122" fill="#38bdf8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="650">Full Stack Developer</text>
    <text x="0" y="162" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Building scalable products, clean interfaces, and cloud-native systems.</text>

    <g transform="translate(0 202)">
      <rect width="180" height="40" rx="10" fill="#4f46e5"/>
      <text x="90" y="26" text-anchor="middle" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">PORTFOLIO ↗</text>

      <rect x="194" width="150" height="40" rx="10" fill="#0b1220" stroke="#38bdf8"/>
      <text x="269" y="26" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">LINKEDIN</text>
    </g>
  </g>

  <g transform="translate(795 98)">
    <rect width="325" height="170" rx="22" fill="#0b1220" fill-opacity=".78" stroke="#26375f"/>
    <circle cx="32" cy="31" r="5" fill="#fb7185"/>
    <circle cx="52" cy="31" r="5" fill="#fbbf24"/>
    <circle cx="72" cy="31" r="5" fill="#34d399"/>
    <text x="28" y="74" fill="#8b5cf6" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">const</text>
    <text x="82" y="74" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">build = [</text>
    <text x="46" y="103" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">"Laravel", "Vue",</text>
    <text x="46" y="129" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">"React", "Go", "AWS"</text>
    <text x="28" y="154" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">];</text>
  </g>

  <rect x="70" y="322" width="1060" height="2" rx="1" fill="url(#accent)" opacity=".7"/>
